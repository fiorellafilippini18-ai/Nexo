services:
  - type: web
    name: panel-desempeno
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false      # pegar acá la connection string de Neon
      - key: ADMIN_NOMBRE
        value: Supervisora
      - key: ADMIN_PASSWORD
        sync: false      # contraseña provisoria del primer ingreso
